    <!-- FAQPage schema (preparado para a secção FAQ da Home) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "O que é o TECNATO?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "TECNATO é uma plataforma angolana de identificação, valorização e visibilidade de talentos, projectos e iniciativas nas áreas de Gestão, Administração, Ciência, Inovação, Empreendedorismo e Tecnologia."
            }
          },

            "@type": "Question",
            "name": "Como posso candidatar o meu projecto ao TECNATO?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Podes candidatar o teu projecto através do formulário em tecnatoangola.com/candidatura, enviando um vídeo (até 3 min) e uma foto da equipa. Também podes enviar por WhatsApp."
            }
          },
          {
            "@type": "Question",
            "name": "Quem pode participar no TECNATO?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Qualquer equipa com um projecto nas áreas de Gestão, Administração, Ciência, Inovação, Empreendedorismo, Tecnologia, Impacto Social ou Invenções, que represente um município de Luanda."
            }
          },
          {
            "@type": "Question",
            "name": "O TECNATO é uma incubadora ou aceleradora?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "O TECNATO é uma plataforma de visibilidade e identificação de talento. Não é uma incubadora tradicional, mas conecta projectos a oportunidades, parceiros e visibilidade."
            }
          }
        ]

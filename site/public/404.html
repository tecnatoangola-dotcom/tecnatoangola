<!DOCTYPE html>
<html lang="pt-AO">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Página não encontrada — TECNATO</title>
  <link rel="canonical" href="https://tecnatoangola.com/404" />
  <meta property="og:title" content="Página não encontrada — TECNATO" />
  <meta property="og:description" content="A página que procuraste não existe. Volta ao início do TECNATO." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://tecnatoangola.com/404" />
  <meta property="og:image" content="https://tecnatoangola.com/og-tecnato.png" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d0d0d; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .container { text-align: center; max-width: 400px; }
    .code { font-size: 6rem; font-weight: 700; color: #e8b439; line-height: 1; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.75rem; }
    p { color: #aaa; margin-bottom: 2rem; line-height: 1.6; }
    a { display: inline-block; background: #e8b439; color: #0d0d0d; padding: 0.875rem 2rem; border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: opacity 0.2s; }
    a:hover { opacity: 0.9; }
    .whatsapp { background: #25d366; margin-left: 1rem; }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1 id="titulo">Página não encontrada</h1>
    <p id="texto">A página que procuras não existe ou foi movida.<br />Volta ao início ou contacta-nos.</p>
    <a id="voltar" href="https://tecnatoangola.com/">← Voltar ao início</a>
    <a id="whatsapp" href="https://wa.me/244935073125" target="_blank" rel="noreferrer" class="whatsapp">Falar no WhatsApp</a>
  </div>
  <script>
    // A 404 é servida estaticamente pelo Netlify, fora do React: escolhe o idioma
    // guardado pelo site (ou do browser) sem depender do bundle.
    ;(function () {
      var pt = {
        html: 'pt-AO',
        titulo: 'Página não encontrada — TECNATO',
        heading: 'Página não encontrada',
        texto: 'A página que procuras não existe ou foi movida.<br />Volta ao início ou contacta-nos.',
        voltar: '← Voltar ao início',
        whatsapp: 'Falar no WhatsApp',
        descricao: 'A página que procuraste não existe. Volta ao início do TECNATO.'
      }
      var en = {
        html: 'en',
        titulo: 'Page not found — TECNATO',
        heading: 'Page not found',
        texto: 'The page you are looking for does not exist or has been moved.<br />Go back home or talk to us.',
        voltar: '← Back to home',
        whatsapp: 'Chat on WhatsApp',
        descricao: 'The page you were looking for does not exist. Go back to the TECNATO home page.'
      }
      var idioma = null
      try { idioma = localStorage.getItem('tecnato:idioma') } catch (e) {}
      if (idioma !== 'pt' && idioma !== 'en') {
        idioma = (navigator.language || '').toLowerCase().indexOf('pt') === 0 ? 'pt' : 'en'
      }
      var t = idioma === 'en' ? en : pt
      document.documentElement.lang = t.html
      document.title = t.titulo
      document.getElementById('titulo').textContent = t.heading
      document.getElementById('texto').innerHTML = t.texto
      document.getElementById('voltar').textContent = t.voltar
      document.getElementById('whatsapp').textContent = t.whatsapp
      var ogTitulo = document.querySelector('meta[property="og:title"]')
      var ogDesc = document.querySelector('meta[property="og:description"]')
      if (ogTitulo) ogTitulo.setAttribute('content', t.titulo)
      if (ogDesc) ogDesc.setAttribute('content', t.descricao)
    })()
  </script>
</body>
</html>
